<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA1 map</title>
  <link rel="icon" href="data:,">
  <!-- Only the site origin ever leaves as a referrer; map state sits in the URL fragment,
       which browsers never send anywhere. The CSP is defence in depth: no inline script,
       scripts and styles only from this site, tiles only from OpenStreetMap, and the usage
       log only to Apps Script (which answers with a redirect to googleusercontent). -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div id="sidebar">
    <h1>SA1 map</h1>

    <label for="codes">SA1 codes</label>
    <textarea id="codes" rows="3" placeholder="Paste SA1 codes (commas, spaces or new lines), then press Enter"></textarea>
    <div class="buttons">
      <button id="apply" type="button">Show</button>
      <button id="print" type="button">Print</button>
      <button id="clear" type="button">Clear</button>
    </div>

    <label for="seat">Whole seat</label>
    <select id="seat"><option value="">Choose a seat…</option></select>

    <label for="suburb">Suburb <span id="suburb-scope" class="muted"></span></label>
    <select id="suburb"><option value="">Choose a suburb…</option></select>

    <label for="name">Your name <span class="muted">(for the print log)</span></label>
    <input id="name" placeholder="Optional" maxlength="80">

    <div id="status"></div>
    <div id="help">Click an SA1 on the map to add it. Click a selected SA1 to set its PIN. Zoom in to see the surrounding SA1s. Dashed red lines are state district boundaries. Print gives one A4 page per SA1.</div>

    <h2>Selected SA1s <span id="count"></span></h2>
    <div id="selected-list"></div>
  </div>

  <div id="map"></div>

  <div id="print-pages"></div>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
