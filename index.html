<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA1 map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <label for="codes">SA1 codes</label>
    <textarea id="codes" rows="2" placeholder="Paste SA1 codes here (commas, spaces or new lines), then press Enter"></textarea>
    <div id="buttons">
      <button id="apply" type="button">Show</button>
      <button id="addpin" type="button">Add pin</button>
      <button id="print" type="button">Print</button>
    </div>
    <div id="status"></div>
    <div id="help">Click an SA1 on the map to add or remove it. Zoom in to see the surrounding SA1s. Click a pin to remove it, drag to move it.</div>
  </div>

  <div id="page">
    <div id="header">
      <div id="header-title">SA1 map</div>
      <ul id="header-list"></ul>
      <div id="header-date"></div>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
